name: ci

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: for f in scripts/*.sh tests/*.sh; do bash -n "$f"; done
      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning scripts/*.sh tests/*.sh || true
      - name: Tests
        run: ./tests/run-tests.sh
